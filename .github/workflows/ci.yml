name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build project toolchain
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/container/Containerfile
          load: true
          tags: w4me-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test and build release artifacts
        env:
          W4ME_TOOLCHAIN_IMAGE: w4me-toolchain:ci
        run: ./tools/release.sh

      - name: Verify checked-in release artifacts
        run: git diff --exit-code -- dist
